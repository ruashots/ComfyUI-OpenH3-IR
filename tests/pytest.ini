# The pytest configuration lives HERE, in the tests folder, and that is not a preference.
#
# This repository's root is the node pack, so it holds an `__init__.py`, and ComfyUI Manager clones
# it into `custom_nodes` under the repository's own name. Both of those facts together break pytest
# when its rootdir is the repository root:
#
#   * pytest turns any directory holding an `__init__.py` into a Package collector and imports that
#     file as a test module before it runs anything underneath it.
#   * to name the module it walks up while each folder name is a Python identifier. `ComfyUI-OpenH3-IR`
#     has hyphens in it, so the walk stops immediately and the file is imported as the bare
#     top-level module `__init__`, with no parent package.
#   * `__init__.py` starts with `from . import web_api`, which is correct under ComfyUI's loader and
#     an ImportError with no parent package. Every test in the suite then errors in setup.
#
# Measured on pytest 9.1.1. Neither `--import-mode=importlib`, nor `consider_namespace_packages`,
# nor `--ignore` avoids it: the Package collector is built from the rootdir before any of them apply.
#
# An ini file here makes `tests/` the rootdir, so collection starts below the pack and the root
# `__init__.py` is never imported as anything. Run the suite as `pytest tests` from the repository
# root, or as `pytest` from inside this folder. `conftest.py` at the repository root says the same
# thing to anyone who runs it the other way.
[pytest]
